<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Hachisu</title>

<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --ground:  #FAF8F5;
    --ink:     #17130F;
    --muted:   #675C53;
    --line:    #E3DCD2;
    --accent-ink: #7C4E0C;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121009;
      --ink:    #F1ECE4;
      --muted:  #A2968A;
      --line:   #2C2620;
      --accent-ink: #F0BE6B;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121009;
    --ink:    #F1ECE4;
    --muted:  #A2968A;
    --line:   #2C2620;
    --accent-ink: #F0BE6B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 30px; letter-spacing: -0.025em; margin: 0 0 12px; font-weight: 700; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent-ink); text-underline-offset: 2px; }
  a:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; border-radius: 3px; }
  .rule { height: 1px; background: var(--line); margin: 24px 0; border: 0; }
  .brand { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Page not found</h1>

    <p><a href="/">Go to the Hachisu home page</a></p>
    <hr class="rule">
    <p class="brand"><strong>Hachisu</strong> — a non-custodial Bitcoin payment app for merchants.</p>
  </div>
</body>
</html>
