<!doctype html>
<html lang="en">
<head>

<title>Page not found — Hachisu</title>

<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --ground:     #000000;
    --line:       #1A1A1A;
    --line-2:     #2A2A2A;
    --ink:        #F2EDE3;
    --muted:      #A0958A;
    --faint:      #8A8076;
    --orange:     #F28C10;
    --orange-ink: #E9A445;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI",
            Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "JetBrains Mono",
            "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(110% 80% at 70% 20%, rgba(242,140,16,0.016), transparent 62%);
  }
  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 48px clamp(20px, 6vw, 40px); }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--ink); text-decoration: none;
    font-weight: 600; font-size: 17px; letter-spacing: -0.015em;
    margin-bottom: 34px;
  }
  .brand svg { display: block; color: var(--cream); }
  .code {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--faint); margin: 0 0 12px;
  }
  h1 { font-size: clamp(30px, 6vw, 40px); letter-spacing: -0.032em; margin: 0 0 14px; font-weight: 600; }
  p { color: var(--muted); margin: 0 0 22px; max-width: 46ch; }
  .back {
    display: inline-flex; align-items: center; gap: 9px;
    min-height: 44px; padding: 10px 18px;
    border: 1px solid var(--line-2); border-radius: 2px;
    color: var(--ink); text-decoration: none;
    font-weight: 600; font-size: 15px;
    transition: border-color .16s ease, color .16s ease;
  }
  .back:hover { border-color: var(--orange); color: var(--orange-ink); }
  .back svg { transition: transform .18s ease; }
  .back:hover svg { transform: translateX(3px); }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; border-radius: 2px; }
  .rule { height: 1px; background: var(--line); margin: 34px 0 20px; border: 0; }
  .foot { font-family: var(--mono); font-size: 11px; letter-spacing: 0.13em;
          text-transform: uppercase; color: var(--faint); margin: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
  }
</style>
</head>

  <div class="wrap">

             identity. The faint lighter stroke on the cube is its dimensional
             edge, not a border. -->
        <polygon points="24.00,3.60 41.67,13.80 41.67,34.20 24.00,44.40 6.33,34.20 6.33,13.80"

        <polygon points="25.24,12.17 34.87,19.16 33.63,30.99 22.76,35.83 13.13,28.84 14.37,17.01"
          fill="currentColor" stroke="#FBFAF4" stroke-opacity="0.55" stroke-width="0.9" stroke-linejoin="round"/>
      </svg>
      Hachisu
    </a>

    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>There is no page at this address on hachisu.io.</p>

    <a class="back" href="/">
      Go to the home page
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" aria-hidden="true">
        <path d="M1 5.5h12M9 1.5l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <hr class="rule">
    <p class="foot">Hachisu · Non-custodial Bitcoin payments for merchants</p>
  </div>
</body>
</html>
