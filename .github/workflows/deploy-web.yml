# Publishes the public marketing site in web/ to GitHub Pages.
name: Deploy public site

# The site is a static directory — there is no build step, and nothing here
# touches the Expo app, Supabase, or BTCPay. It deploys only when web/ (or this
# workflow) changes on the default branch.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify discoverability invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The guard is the gate: a site that would ship a wrong canonical host,
      # registrar identity, blocked robots.txt, or Lightning copy the app gates
      # off must not reach the public domain.
      - name: check:discoverability
        run: node ./scripts/check-discoverability.mjs
      - name: check:discoverability self-test
        run: node ./scripts/check-discoverability.selftest.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
